name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check app tests
      - run: pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install API dependencies
        working-directory: services/api
        run: python -m pip install -e ".[dev]"
      - name: Install Web dependencies and Playwright
        working-directory: apps/web
        run: |
          npm install
          npx playwright install --with-deps chromium
          npm run build
      - name: Run Playwright E2E against live API & Web
        run: |
          (cd services/api && uvicorn app.main:app --host 127.0.0.1 --port 8000 &)
          (cd apps/web && NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/api/v1 npm run start &)
          npx wait-on http://localhost:3000 http://127.0.0.1:8000/health -t 30000 || sleep 5
          cd apps/web && npm run test:e2e
