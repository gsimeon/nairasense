name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check app tests
      - run: pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install API dependencies
        working-directory: services/api
        run: python -m pip install -e ".[dev]"
      - name: Install Web dependencies and Playwright
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
      - name: Run Playwright E2E against live API & Web
        env:
          E2E_BASE_URL: http://localhost:3000
        run: |
          (cd services/api && uvicorn app.main:app --host 127.0.0.1 --port 8000) > api.log 2>&1 &
          API_PID=$!
          (cd apps/web && npm run start) > web.log 2>&1 &
          WEB_PID=$!
          trap "kill $API_PID $WEB_PID 2>/dev/null || true" EXIT
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health >/dev/null && curl -sf http://localhost:3000 >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/health >/dev/null
          curl -sf http://localhost:3000 >/dev/null
          cd apps/web && npm run test:e2e
      - name: Upload Playwright and server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            api.log
            web.log
          retention-days: 7
