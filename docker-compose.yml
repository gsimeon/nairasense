services:
  postgres:
    image: postgres:16-alpine
    container_name: nairasense-postgres
    environment:
      POSTGRES_DB: nairasense
      POSTGRES_USER: nairasense
      POSTGRES_PASSWORD: nairasense_dev
    ports:
      - "5432:5432"
    volumes:
      - nairasense_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nairasense -d nairasense"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nairasense_pgdata:
